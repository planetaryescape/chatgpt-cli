# The Rust port lives beside the TS CLI until the TS code is deleted.
[workspace]
resolver = "3"
members = ["crates/chatgpt"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/planetaryescape/chatgpt-cli"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"

[workspace.dependencies]
chatgpt = { path = "crates/chatgpt" }

aes = "0.8"
cbc = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
# Chrome TLS and HTTP/2 impersonation, the engine under the TS CLI's npm
# `impit` 0.14.5 (tag js-0.14.5). Not on crates.io: it needs the
# [patch.crates-io] forks below and `--cfg reqwest_unstable` (.cargo/config.toml).
impit = { git = "https://github.com/apify/impit", rev = "152e7db1d39b35affd9635675b575e8ba5d0565f" }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# Reads the binary LaunchServices plist without spawning plutil.
plist = "1"
# Exact pins keep the resolver from moving past what apify's forks (below)
# support. Cargo would drop a patch with only a warning, losing the Chrome
# fingerprint. Match impit's Cargo.lock at the pinned impit rev.
h2 = "=0.4.7"
hyper = "=1.8.1"
# impit returns reqwest types.
reqwest = { version = "=0.13.2", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }

tempfile = "3"
wiremock = "0.6"

# impit's browser fingerprints live in these forks. Keep the revs in step with
# impit's own workspace manifest at the pinned impit rev.
[patch.crates-io]
h2 = { git = "https://github.com/apify/h2", rev = "7f393a728a8db07cabb1b78d2094772b33943b9a" }
rustls = { git = "https://github.com/apify/rustls", rev = "23b2c17427c095b768e22ccf0dadb97266860cf1" }
tower-http = { git = "https://github.com/apify/tower-http", rev = "f9efc0d9193e774d33aedc1022b922efefc22052" }
hyper-util = { git = "https://github.com/apify/hyper-util", rev = "9b7795dfd7158fc55e7c84b65bf1dae1d2dea67d" }
