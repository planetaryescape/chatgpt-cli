[package]
name = "chatgpt-cli"
version.workspace = true
edition.workspace = true
publish = false
description = "The chatgpt command: native commands over the daemon, everything else bridged to the TS CLI."

[lib]
name = "chatgpt_cli"
path = "src/lib.rs"

# The one binary: the CLI, and the daemon it starts (`chatgpt daemon run`).
# Only src/main.rs may name the daemon crate; the CLI reaches it over IPC
# (tests/workspace_boundaries.rs).
[[bin]]
name = "chatgpt"
path = "src/main.rs"

[dependencies]
chatgpt-core = { workspace = true }
chatgpt-daemon = { workspace = true }
# `chatgpt daemon embed-worker`, the process the daemon runs the model in.
chatgpt-embed = { workspace = true }
chatgpt-launcher = { workspace = true }
chatgpt-protocol = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
# `configure` reads a key with the terminal's echo off.
nix = { workspace = true, features = ["term"] }
# Writes the LaunchAgent for `daemon install`.
plist = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
unicode-width = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
fake-chatgpt = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
