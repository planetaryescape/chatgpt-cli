[package]
name = "chatgpt-launcher"
version.workspace = true
edition.workspace = true
publish = false
description = "Client side of the daemon: find it, start it detached, restart an incompatible one, stop it, and talk to it."

[dependencies]
chatgpt-core = { workspace = true }
chatgpt-protocol = { workspace = true }
fs2 = { workspace = true }
futures-util = { workspace = true }
nix = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "time"] }
tokio-util = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
