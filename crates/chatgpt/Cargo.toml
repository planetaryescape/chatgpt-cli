[package]
name = "chatgpt"
version.workspace = true
edition.workspace = true
publish = false
description = "chatgpt.com access: browser session cookies, the session-token exchange and a Chrome-impersonating HTTP client."

[dependencies]
aes = { workspace = true }
bytes = { workspace = true }
cbc = { workspace = true }
# Not used directly: pinned so impit's fingerprint forks stay in the graph.
h2 = { workspace = true }
hyper = { workspace = true }
impit = { workspace = true }
pbkdf2 = { workspace = true }
plist = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock = { workspace = true }

[lints]
workspace = true
